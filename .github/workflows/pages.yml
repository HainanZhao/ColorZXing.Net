name: Deploy WebAssembly demo

on:
  push:
    branches: [master]
    paths:
      - "Demo/**"
      - "ColorZXing/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Publish demo
        run: dotnet publish Demo/ColorZXing.Demo.csproj -c Release -o publish
      - name: Prepare GitHub Pages base path
        run: |
          sed -i 's|<base href="/" />|<base href="/ColorZXing.Net/" />|' publish/wwwroot/index.html
          touch publish/wwwroot/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
